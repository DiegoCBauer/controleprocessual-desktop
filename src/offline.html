<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Controle Processual — sem conexão</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#eef2f7,#f8fafc);color:#111827}
  .card{width:min(430px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 10px 30px rgba(17,24,39,.08)}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#6b7280;margin:0 0 20px;line-height:1.5}
  button{width:100%;border:0;border-radius:10px;padding:12px;background:#1e3a5f;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  button:hover{background:#17304f}
</style>
</head>
<body>
  <div class="card">
    <h1>Sem conexão com o sistema</h1>
    <p>Não foi possível acessar o Controle Processual. Verifique sua conexão com a internet e tente novamente.</p>
    <button id="retry" type="button">Tentar novamente</button>
  </div>
<script>
  const target = new URLSearchParams(location.search).get('url') || 'https://cpclezarkuchler.vercel.app/';
  document.getElementById('retry').addEventListener('click', () => { location.href = target; });
  window.addEventListener('online', () => { location.href = target; });
</script>
</body>
</html>
